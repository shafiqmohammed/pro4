<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    

    <title>DIV and SPAN Example 2</title>

    <style>

        .card {

            border: 2px solid rgb(255, 235, 17);

            background-color: #c6fffd;

            padding: 20px;

              margin: 20px;

            border-radius: 8px;

        }



        .important {

            color: rgb(217, 25, 0);

            font-weight: bold;

        }

    </style>

</head>

<body>



    <div class="card">

        <h2>Student Information</h2>

        <p>Name: <span class="important">Mohan prasanth D</span></p>

        <p>Department: BCA</p>

        <p>Status: <span class="important">Active</span></p>

    </div>



    <div class="card">

        <h2>Course Details</h2>

        <p>Course: Web Development</p>

        <p>Duration: <span class="important">6 Months</span></p>

        <p>Mode: Online</p>

    </div>



</body>

</html>
