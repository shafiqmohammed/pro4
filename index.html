
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DIV and SPAN Example</title>

<style>
body {
    background-color: #121212;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    background-color: #1e1e2f;
    border: 2px solid #a855f7;
    padding: 20px;
    margin: 25px;
    border-radius: 12px;
    box-shadow: 0 0 10px #6b21a8;
}

h2 {
    color: #c084fc;
}

.highlight {
    color: #00ffff;
    font-weight: bold;
    background-color: #292944;
    padding: 4px;
    border-radius: 4px;
}
</style>
</head>

<body>

<div class="container">
    <h2>DIV Element Example</h2>

    <p>
        The <strong>DIV</strong> element groups HTML
        content into a separate block.
    </p>

    <p>
        This is a
        <span class="highlight">glowing SPAN element</span>
        inside a paragraph.
    </p>
</div>

<div class="container">
    <h2>SPAN Element Example</h2>

    <p>
        The <span class="highlight">SPAN element</span>
        styles specific words without creating a new block.
    </p>
</div>

</body>
</html>
